<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>テニプリ 推し活カレンダー | 公式ポスター画像</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      overflow-x: auto;
    }
    /* ヘッダーツールバー */
    .cal-viewer-header {
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .cal-viewer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: #fef08a;
      letter-spacing: 0.5px;
    }
    .cal-viewer-title i {
      color: #ccff00;
    }
    .cal-viewer-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cal-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: #facc15;
      color: #facc15;
    }
    .cal-btn.close-btn {
      background: #e11d48;
      border-color: #e11d48;
    }
    .cal-btn.close-btn:hover {
      background: #be123c;
      color: #ffffff;
    }

    /* 画像表示コンテナ */
    .cal-img-container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .cal-poster-img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(204, 255, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: zoom-in;
      transition: transform 0.25s ease;
    }
    .cal-poster-img.zoomed {
      max-width: none;
      width: 1400px;
      cursor: zoom-out;
    }
    .cal-hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="cal-viewer-header">
    <div class="cal-viewer-title">
      <i class="fa-solid fa-calendar-days"></i>
      <span>テニプリ 推し活カレンダー (公式ポスター画像)</span>
    </div>
    <div class="cal-viewer-controls">
      <button class="cal-btn" id="zoom-btn" onclick="toggleZoom()">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
        <span id="zoom-text">拡大表示</span>
      </button>
      <a class="cal-btn" href="assets/calendar_poster.png" download="tenipuri_calendar.png">
        <i class="fa-solid fa-download"></i>
        <span>画像保存</span>
      </a>
      <button class="cal-btn close-btn" onclick="window.close();">
        <i class="fa-solid fa-xmark"></i>
        <span>閉じる</span>
      </button>
    </div>
  </div>

  <div class="cal-img-container">
    <img src="assets/calendar_poster.png" alt="テニプリ 推し活カレンダー" class="cal-poster-img" id="poster-img" onclick="toggleZoom()" />
  </div>
  <div class="cal-hint">※画像をクリックすると拡大/縮小できます。スマホではピンチイン/ピンチアウトで自由にズーム可能です。</div>

  <script>
    function toggleZoom() {
      const img = document.getElementById('poster-img');
      const text = document.getElementById('zoom-text');
      const btn = document.getElementById('zoom-btn');
      img.classList.toggle('zoomed');
      if (img.classList.contains('zoomed')) {
        text.textContent = '標準サイズに戻す';
        btn.querySelector('i').className = 'fa-solid fa-magnifying-glass-minus';
      } else {
        text.textContent = '拡大表示';
        btn.querySelector('i').className = 'fa-solid fa-magnifying-glass-plus';
      }
    }
  </script>
</body>
</html>
